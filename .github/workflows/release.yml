name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.3.1." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp app version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Info.plist
          plutil -replace SukiBuildTag -string "${{ steps.version.outputs.tag }}" Info.plist

      - name: Build release notes from changelog
        id: release_notes
        run: |
          .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## Download"
            echo
            echo "**[Suki.dmg](https://github.com/ansuman-shukla/Suki/releases/download/${{ steps.version.outputs.tag }}/Suki.dmg)** — Universal build for all Macs (Apple Silicon + Intel)."
            echo
            echo "**First launch:** open the DMG and drag Suki to Applications. macOS blocks the first launch because Suki is not notarized by Apple: open Suki once, then go to System Settings > Privacy & Security and click **Open Anyway**. Updates after that install from inside the app."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install create-dmg fileicon

      # --- Code signing setup ---
      # Releases are signed with the project's self-signed "Suki Release" certificate, not an
      # Apple Developer ID, so they are not notarized. Users approve the first launch once in
      # System Settings. Every release must use the same certificate: the in-app updater only
      # installs updates that match the installed app's signature.
      # Required GitHub secrets:
      #   SUKI_SIGNING_CERTIFICATE_BASE64 — base64-encoded .p12 with the certificate and private key
      #   SUKI_SIGNING_CERTIFICATE_PASSWORD — password for the .p12
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.SUKI_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SUKI_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "Missing SUKI_SIGNING_CERTIFICATE_BASE64 or SUKI_SIGNING_CERTIFICATE_PASSWORD secret." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          # Decode certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate and delete .p12 from disk immediately
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          # Allow codesign to access the keychain without UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temporary keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # A self-signed certificate is never "valid" to find-identity -v, so select it by its SHA-1 hash.
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN_PATH" | awk '/\) [0-9A-F]{40} "Suki Release"/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "No \"Suki Release\" signing identity found in the certificate." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Found signing identity: $IDENTITY"

      # --- Build universal ---
      - name: Build universal
        run: make ARCH=universal APP_NAME=Suki BUNDLE_ID=com.ansumanshukla.suki CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Create universal DMG
        run: make dmg ARCH=universal APP_NAME=Suki BUNDLE_ID=com.ansumanshukla.suki CODESIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Sign universal DMG
        run: codesign --force --sign "$CODESIGN_IDENTITY" build/Suki.dmg

      - name: Verify app signature
        run: |
          hdiutil attach build/Suki.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/suki-dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/suki-dmg/Suki.app"
          codesign -d -r- "$RUNNER_TEMP/suki-dmg/Suki.app"
          hdiutil detach "$RUNNER_TEMP/suki-dmg"

      - name: Save universal DMG
        run: mv build/Suki.dmg Suki.dmg

      # --- Release ---
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Suki ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
          make_latest: true
          files: |
            Suki.dmg

      # --- Cleanup ---
      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
